name: Scout leads

on:
  workflow_dispatch:
  push:
    paths:
      - 'searches.json'

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the scout
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: python scout.py

      - name: Grade the websites
        run: python grade.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leads.csv leads_graded.csv
          git diff --staged --quiet || git commit -m "Update leads [skip ci]"
          git pull --rebase origin main
          git push
